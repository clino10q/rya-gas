<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RYA Gas — Powering Every Mile</title>
    <meta
      name="description"
      content="RYA is a full-stream Nigerian energy company delivering fuel, LPG, CNG, lube oils, bulk storage and marine logistics."
    />
    <link rel="icon" type="image/png" href="/flame.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                DEFAULT: "#0A2540",
                900: "#071A2E",
                800: "#0A2540",
                700: "#0F345C",
              },
              flame: { DEFAULT: "#F2A73B", 600: "#E8922A" },
              ember: { DEFAULT: "#E15A2D" },
              cream: "#F6F3EC",
              ink: "#12181F",
            },
            fontFamily: {
              display: ['"Fraunces"', "serif"],
              body: ["system-ui", "-apple-system", "sans-serif"],
              mono: ['"Berkeley Mono"', '"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #f6f3ec;
      }
      .clip-flame {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 50% 100%, 0 85%);
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      @keyframes ticker-scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      .ticker-track {
        animation: ticker-scroll 28s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .ticker-track {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-cream text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
